<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003b7a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230655c9'/%3E%3Cpath d='M19 16h18c8 0 12 4 12 10 0 7-5 11-13 11h-6v11H19V16Zm11 9v4h7c2 0 3-1 3-2s-1-2-3-2h-7Z' fill='white'/%3E%3C/svg%3E" />
    <title>Project Pulse | タスク・リスク管理</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#dashboard" data-view-link="dashboard"><span class="brand-mark">P</span><span>Project<br />Pulse</span></a>
        <nav class="main-nav" aria-label="メインナビゲーション">
          <button class="nav-link active" data-view-link="dashboard"><span>▦</span>ダッシュボード</button>
          <button class="nav-link" data-view-link="tasks"><span>✓</span>タスク</button>
          <button class="nav-link" data-view-link="risks"><span>◇</span>リスク</button>
        </nav>
        <div class="sidebar-footer">
          <span class="eyebrow">プロジェクト</span>
          <label class="project-select-label" for="projectFilter">表示対象</label>
          <select id="projectFilter"><option>新システム導入</option><option>Web刷新</option></select>
          <button id="resetData" class="reset-button">サンプルデータに戻す</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="viewEyebrow">プロジェクトの状態</p>
            <h1 id="viewTitle">ダッシュボード</h1>
          </div>
          <button class="primary-button" id="quickAdd"><span>＋</span> 新規登録</button>
        </header>

        <section class="view active" id="dashboardView" aria-labelledby="viewTitle">
          <div class="summary-grid" id="summaryGrid"></div>
          <div class="workspace-grid">
            <section class="surface priority-surface">
              <div class="section-heading"><div><p class="eyebrow">ACTION REQUIRED</p><h2>今週の優先事項</h2></div><button class="text-button" data-view-link="tasks">すべてのタスク →</button></div>
              <div id="priorityTasks" class="priority-list"></div>
            </section>
            <section class="surface risk-surface">
              <div class="section-heading"><div><p class="eyebrow risk-eyebrow">RISK WATCH</p><h2>高リスク</h2></div><button class="text-button" data-view-link="risks">管理する →</button></div>
              <div id="priorityRisks" class="risk-list"></div>
            </section>
          </div>
          <section class="surface task-snapshot">
            <div class="section-heading"><div><p class="eyebrow">TEAM WORK</p><h2>タスクの状況</h2></div><button class="text-button" data-view-link="tasks">一覧を開く →</button></div>
            <div id="dashboardTasks" class="table-wrap"></div>
          </section>
        </section>

        <section class="view" id="tasksView">
          <div class="page-intro"><div><p class="eyebrow">TASKS</p><h2>タスク管理</h2><p>担当・期限・進捗を更新し、チームの作業を揃えます。</p></div><button class="primary-button" data-open-modal="task">＋ タスクを追加</button></div>
          <section class="surface"><div id="taskTable" class="table-wrap"></div></section>
        </section>

        <section class="view" id="risksView">
          <div class="page-intro"><div><p class="eyebrow">RISK REGISTER</p><h2>リスク管理</h2><p>影響が大きい項目から、対応状況を明らかにします。</p></div><button class="primary-button" data-open-modal="risk">＋ リスクを追加</button></div>
          <section class="surface"><div id="riskTable" class="risk-register"></div></section>
        </section>
      </main>
    </div>

    <dialog id="entryModal" class="entry-modal">
      <form method="dialog" id="entryForm">
        <div class="modal-header"><div><p class="eyebrow" id="modalEyebrow">NEW ENTRY</p><h2 id="modalTitle">タスクを追加</h2></div><button class="icon-button" value="cancel" aria-label="閉じる">×</button></div>
        <div id="formFields" class="form-fields"></div>
        <p class="form-error" id="formError" role="alert"></p>
        <div class="modal-actions"><button class="secondary-button" value="cancel">キャンセル</button><button class="primary-button" id="saveEntry" value="default">登録する</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
